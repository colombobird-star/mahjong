<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123330">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="麻雀ドリル">
<title>麻雀 実力診断＋強化ドリル</title>
<style>
  :root{
    --felt:#123330; --feltDeep:#0C2523; --feltLine:#1D4A44;
    --ivory:#F2EDE0; --ivoryEdge:#D6CCB4; --ink:#1A2422; --inkSoft:#5A6B66;
    --vermilion:#C4342B; --brass:#B08D3F; --jade:#2F8F6D; --blue:#2B5F8C; --green:#2E7D4F;
    --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
    --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    --mono:"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--felt); color:var(--ivory); font-family:var(--sans);
    font-size:15px; line-height:1.7; -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:680px;margin:0 auto;padding:22px 16px 64px}
  .eyebrow{color:var(--brass);font-size:11px;letter-spacing:.18em;font-weight:600}
  h1{font-family:var(--serif);font-size:29px;letter-spacing:.04em;line-height:1.25;margin:4px 0 0;font-weight:600}
  .lede{color:#9DB5AF;font-size:13.5px;margin:8px 0 0}
  .lede b{color:var(--vermilion);font-weight:600}

  nav{display:flex;flex-wrap:wrap;gap:5px;margin:20px 0}
  nav button{
    font-family:inherit;font-size:13.5px;padding:6px 12px;border-radius:3px;
    background:transparent;color:#9DB5AF;border:1px solid var(--feltLine);cursor:pointer
  }
  nav button.on{background:var(--ivory);color:var(--ink);border-color:var(--ivory);font-weight:600}
  nav button:focus-visible,.card button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  .card{background:var(--ivory);color:var(--ink);border-radius:6px;padding:16px;margin-bottom:16px}
  .card.tight{padding:12px}
  .note{
    background:var(--feltDeep);color:#BFD3CD;border:1px solid var(--feltLine);
    border-radius:3px;padding:12px;font-size:13.5px;margin-bottom:16px
  }
  .note .k{color:var(--brass)}
  .sub{color:var(--inkSoft);font-size:12px}

  /* tiles */
  .hand{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 12px;
        background:#E5DDCA;border-radius:3px;padding:12px;margin:12px 0 16px}
  .grp{display:flex;gap:1px}
  .tile{width:28px;height:40px;border-radius:2px;background:var(--ivory);
        border-bottom:3px solid var(--ivoryEdge);box-shadow:0 1px 2px rgba(0,0,0,.35);
        display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:0 0 auto}
  .tile .n{font-size:15px;font-weight:700}
  .tile .s{font-size:9px;font-weight:500;margin-top:1px}
  .tile .z{font-size:17px;font-weight:700}
  .tile.red{background:#FBEDE7;border-bottom-color:#E0B3A8}
  .m{color:#8C2F2A}.p{color:var(--blue)}.s3{color:var(--green)}.z{color:var(--ink)}
  .redc{color:var(--vermilion)}

  /* choices */
  .q{font-weight:600;margin:0 0 12px;line-height:1.65}
  .choices{display:flex;flex-direction:column;gap:8px}
  .choices button{
    font-family:inherit;font-size:14px;text-align:left;padding:10px 12px;border-radius:3px;
    background:#fff;border:1px solid var(--ivoryEdge);color:var(--ink);cursor:pointer;line-height:1.55
  }
  .choices button .idx{font-family:var(--mono);color:var(--brass);margin-right:8px}
  .choices button.right{background:#E4F1EA;border-color:var(--jade)}
  .choices button.wrong{background:#F7E3E1;border-color:var(--vermilion)}
  .choices button.mute{color:#8A968F}
  .verdict{border-top:1px solid var(--ivoryEdge);margin-top:16px;padding-top:12px}
  .verdict .head{font-weight:700;font-size:14px;margin-bottom:4px}
  .verdict p{margin:0;font-size:14px;color:#33403C;line-height:1.75}
  .next{width:100%;margin-top:12px;padding:11px;border-radius:3px;border:0;
        background:var(--ink);color:var(--ivory);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .ghost{width:100%;margin-top:16px;padding:11px;border-radius:3px;background:transparent;
         border:1px solid var(--ivoryEdge);color:var(--ink);font-family:inherit;font-size:14px;cursor:pointer}

  .progress{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .progress .rule{flex:1;height:1px;background:var(--feltLine)}
  .progress .cnt{font-family:var(--mono);font-size:12px;color:var(--brass)}

  .score{display:flex;align-items:flex-end;gap:10px;margin-top:8px}
  .score .big{font-family:var(--mono);font-size:42px;line-height:1;color:var(--ink)}
  .score .of{font-family:var(--mono);font-size:17px;color:var(--inkSoft)}
  .score .lv{margin-left:auto;font-family:var(--serif);font-size:23px;color:var(--vermilion)}

  .bars{display:flex;flex-direction:column;gap:7px;margin-top:10px}
  .bar{display:flex;align-items:center;gap:8px;font-size:13.5px}
  .bar .nm{width:78px;flex:0 0 auto}
  .bar .track{flex:1;height:6px;border-radius:99px;background:#E0D8C4;overflow:hidden}
  .bar .fill{height:6px;border-radius:99px}
  .bar .num{font-family:var(--mono);font-size:11.5px;color:var(--inkSoft);width:44px;text-align:right}

  .weak h4{margin:0;color:var(--vermilion);font-size:14.5px}
  .weak p{margin:2px 0 0;font-size:14px;color:#33403C;line-height:1.7}
  .weak .k{color:var(--brass)}

  .week{display:flex;align-items:baseline;gap:12px}
  .week .no{font-family:var(--mono);font-size:26px;line-height:1;color:var(--vermilion)}
  .week .lab{font-size:11px;color:var(--brass);letter-spacing:.15em}
  .week .ttl{font-family:var(--serif);font-size:18px;color:var(--ink)}
  ul.items{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  ul.items li{font-size:14px;color:#33403C;line-height:1.7;display:flex;gap:8px}
  ul.items li .d{color:var(--brass);flex:0 0 auto}
  ul.items li.focus{background:#F6EFE0;border-radius:3px;padding:6px 8px}
  ul.items li.focus .d{color:var(--vermilion);font-weight:700}

  ol.steps{margin:8px 0 0;padding-left:20px;font-size:14px;color:#33403C;line-height:1.75}
  ul.plain{list-style:none;margin:8px 0 0;padding:0;font-size:14px;color:#33403C;line-height:1.75}

  .danger{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid #E5DDCA}
  .danger:last-child{border-bottom:0}
  .danger .sw{width:7px;flex:0 0 auto;border-radius:2px}
  .danger .t{font-size:13.5px;font-weight:700;color:var(--ink)}
  .danger .t span{font-weight:400;color:var(--brass)}
  .danger .d{font-size:12px;color:#5A6B66;line-height:1.6}

  table{width:100%;border-collapse:collapse;font-size:12px}
  th{color:var(--brass);font-weight:400;text-align:right;padding:4px 0}
  th:first-child{text-align:left}
  td{font-family:var(--mono);text-align:right;padding:6px 0;border-top:1px solid #E5DDCA;color:var(--ink)}
  td:first-child{text-align:left}

  .ptrow{margin-bottom:8px}
  .ptrow .a{font-size:13.5px;font-weight:700;color:var(--ink)}
  .ptrow .b{font-family:var(--mono);font-size:11.5px;color:#5A6B66;line-height:1.7}

  @media (prefers-reduced-motion: no-preference){
    .card{animation:rise .22s ease-out}
    @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">1ヶ月後の半荘に向けて</div>
    <h1>麻雀 実力診断＋強化ドリル</h1>
    <p class="lede">四人麻雀・半荘・<b>赤ドラあり（赤5×3枚）</b>・食いタンあり前提。<span id="qcount"></span>問で現在地を測り、弱いところだけを4週間で潰します。</p>
  </header>
  <nav id="nav"></nav>
  <main id="app"></main>
</div>

<script>
/* ===================== data ===================== */
const CATS = ["牌効率","押し引き","守備","鳴き","待ち・点数"];

const CAT_NOTE = {
  "牌効率":"ブロックの数え方と、手牌を最短でテンパイに近づける選択。",
  "押し引き":"リーチを打つ／押す／降りるの判断。ここが最も点数に効く。",
  "守備":"ベタオリの手順と危険度の把握。放銃を減らす技術。",
  "鳴き":"鳴いた後にアガれるか、守備力をどこまで削るか。",
  "待ち・点数":"自分の待ちと打点を正しく数える。判断の前提になる。"
};

const RX = {
  "牌効率":{
    drill:"何切る問題を1日10問。答えより先に「ブロックはいくつあるか」を数えてから選ぶ。",
    rule:"ブロックが6つ以上あるときはペンチャン・端カンチャンから外す。赤5は浮いていても切らない。"},
  "押し引き":{
    drill:"対局中、リーチが入った瞬間に「良形か／打点はあるか／何シャンテンか」を声に出して3秒で判定する。",
    rule:"2シャンテン以下は無条件で降りる。良形か打点のどちらかが突出していれば押す。赤2枚以上なら愚形でも押してよい。"},
  "守備":{
    drill:"1日1半荘は「リーチが入ったら必ずベタオリ」の縛りでプレーし、降り切る感覚を体に入れる。",
    rule:"降りると決めたら、まず手牌の安全牌を数える。切る順は現物→字牌→スジ→端寄り無筋。"},
  "鳴き":{
    drill:"鳴く前に必ず「鳴いた後の役は何か」を口に出す。答えられない鳴きは全部見送る。",
    rule:"役牌・タンヤオ・混一・トイトイ以外は鳴かない。赤が絡んだタンヤオは積極的に鳴いてよい。"},
  "待ち・点数":{
    drill:"テンパイするたび、待ちの牌と枚数、アガったときの点数を数えてから打牌する。",
    rule:"4枚連続＝両端のノベタン、5連続＝三面張。赤は1枚1翻だが役にはならない。"}
};

const Q = [
{id:1,cat:"牌効率",
 scene:"東1局 3巡目 / ドラ 1p / 自分は西家",
 hand:["2m","3m","4m","5m","6m","7m","3p","4p","5p","東","東","1s","5s","9p"],
 q:"3面子＋東東は確定。5ブロック目の種にするなら、どの浮き牌を残す？",
 choices:["1s","5s","9p","東を1枚外して作り直す"],answer:1,
 why:"浮き牌の価値は「そこから両面がいくつ作れるか」で決まる。5sは34sと67sの両方に育つので受けが最も広い。1s・9pは片側にしか伸びず、両面になる確率が半分以下。まず5sを残し、1sと9pを順に処理する。"},

{id:2,cat:"牌効率",
 scene:"東1局 5巡目 / ドラなし",
 hand:["2m","3m","4m","6m","7m","8m","1p","2p","4p","5p","5s","6s","白","白"],
 q:"何を切る？",
 choices:["1p","4p","6s","白"],answer:0,
 why:"ブロックが6つあり1つ余る（234m・678m・12p・45p・56s・白白）。余らせるのは最弱ブロック。12pのペンチャンは受けが3pの4枚だけで、両面の8枚に対して半分。ペンチャン・端カンチャンから外すのが原則。"},

{id:3,cat:"牌効率",
 scene:"東1局 6巡目 / ドラ 5s",
 hand:["2m","3m","4m","5m","6m","7m","3p","4p","5p","7p","8p","5s","5s","9m"],
 q:"何を切る？",
 choices:["9m","5s","7p","8p"],answer:0,
 why:"9m切りでテンパイ（6p9p待ち）。ドラ対子は雀頭として置いたままにするのが基本で、崩すと打点が半分以下になる。この手はリーチ・平和・ドラ2で7700〜満貫圏。テンパイ＋良形＋高打点が揃っているので、以降は多少の無筋なら押してよい。"},

{id:4,cat:"牌効率",
 scene:"東1局 7巡目 / ドラ 東 / まだ誰もリーチなし",
 hand:["2m","3m","4m","6m","7m","3p","4p","5p","7p","8p","東","東","5s","9s"],
 q:"何を切る？",
 choices:["東","5s","9s","7p"],answer:2,
 why:"234m・345p・67m・78p・東東で5ブロック完成済み。浮いている5sと9sは不要だが、切る順は価値の低い端牌から。東はドラ対子かつ雀頭なので絶対に手放さない。ドラ2の1シャンテンは、ここから打点が跳ねる本線。"},

{id:21,cat:"牌効率",
 scene:"東1局 3巡目 / ドラ 東 / 赤5m を持っている",
 hand:["2m","0m","7m","8m","9m","3p","4p","5p","6p","7p","東","東","1s","9s"],
 q:"何を切る？",
 choices:["1s","0m（赤5m）","2m","東"],answer:0,
 why:"赤5は浮いていても切らない。5という数字はもともと34mと67mの両方に育つ最良の浮き牌で、そのうえ使えれば無条件で1翻。ここで赤5mを手放すのは「リーチのみで終わる未来」を自分で選ぶのと同じ。まず端の1s・9sから処理し、赤5mが両面に育つのを待つ。"},

{id:5,cat:"押し引き",
 scene:"東1局 4巡目 / 自分は子 / ドラなし / 全員無風",
 hand:["2m","3m","4m","5m","6m","7m","3p","4p","5p","7p","9p","白","白"],
 q:"8p待ちのカンチャンでテンパイ。役はなし。どうする？",
 choices:["即リーチ","ダマで様子を見る","テンパイを崩して両面変化を待つ","白を切って手役を狙う"],answer:0,
 why:"愚形でも先制リーチは強い。①リーチ・ツモ・裏・一発で打点が2〜3倍になる、②他家が降りるので放銃されにくく、自分の放銃機会も減る。「愚形だからダマ」は初中級者が最も損をしている判断。迷ったら先制テンパイは即リーチでよい。"},

{id:6,cat:"押し引き",
 scene:"南1局 12巡目 / 対面がリーチ（一発目）/ 点数は平ら",
 hand:[],
 q:"自分は2シャンテン。ツモってきたのは無筋の5s。どうする？",
 choices:["5sを切って手を進める","現物を切ってベタオリ","比較的危険度の低い無筋を選んで押す","鳴いて速度を上げる"],answer:1,
 why:"2シャンテンからアガれる確率はおよそ1割前後。一方で無筋を1枚押す放銃率は5〜6%あり、しかも押し続ける必要がある。テンパイしていない段階での押しは、ほぼ全てのケースで期待値マイナス。「2シャンテン以下は無条件で降りる」を機械的なルールにしてよい。"},

{id:7,cat:"押し引き",
 scene:"東2局 9巡目 / 下家がリーチ / 自分は子",
 hand:[],
 q:"自分は両面待ちのテンパイ、リーチをかければリーチ・ドラ1（＋ツモ裏で満貫圏）。宣言牌は無筋。どうする？",
 choices:["無筋を切ってリーチ","ダマでテンパイ維持","ベタオリ","現物を切ってテンパイを崩す"],answer:0,
 why:"押しの条件は「良形」「打点」「テンパイ」の3つ。この手は全部満たしている。良形高打点テンパイなら、リーチ者に対してほぼ全ての無筋を押してよい。しかもリーチをかけないと打点が伸びず、押している意味が薄れる。降りるべきなのは愚形・安手・シャンテン不足のとき。"},

{id:22,cat:"押し引き",
 scene:"南1局 9巡目 / 上家がリーチ / 自分は子",
 hand:[],
 q:"自分はカンチャン待ちのテンパイ。ただし赤5s2枚とドラ1で、リーチをかければ満貫が見える。宣言牌は無筋。どうする？",
 choices:["無筋を切ってリーチ","ダマでテンパイ維持","ベタオリ","現物を切って回る"],answer:0,
 why:"赤ドラありでは「愚形だから降りる」が成立しなくなる。押し引きは〈形〉と〈打点〉の掛け算で、片方が突出していればもう片方の不足を補える。愚形でも満貫クラスなら押しが優位で、しかもリーチをかけないと打点が伸びないので押すならリーチ。裏を返せば、赤もドラもない安手のときの降りは、赤なしルールより徹底する必要がある。"},

{id:8,cat:"押し引き",
 scene:"オーラス（南4局）/ 自分はトップ目で2着と12000点差 / 8巡目に上家からリーチ",
 hand:[],
 q:"自分は1シャンテン。どうする？",
 choices:["押してアガリに向かう","鳴いて速度を上げる","ベタオリ","形式テンパイを取りにいく"],answer:2,
 why:"リードが大きいオーラスでは、順位が落ちる原因は実質「放銃」だけ。得点の期待値ではなく順位の期待値で判断する場面で、アガリの価値はほぼゼロ、放銃の損失は最大。役満まで打たなくても、満貫〜跳満の放銃で逆転される。ここは全ツッパの逆で、全ベタオリが正解。"},

{id:9,cat:"押し引き",
 scene:"南2局 8巡目 / 親がリーチ / 自分は子",
 hand:[],
 q:"自分はカンチャン待ちのテンパイで役なし・ドラなし（リーチのみ）。リーチをかけるには無筋を切る必要があり、手元には現物が1枚ある。どうする？",
 choices:["無筋を切ってリーチ","現物を切って降りる","無筋を切ってダマ","カンをして打点を上げる"],answer:1,
 why:"親リーチへの放銃は子の1.5倍の失点で、さらに親が連荘する。一方こちらは愚形（受け4枚）・安手。押しの3条件のうち「良形」も「打点」も欠けている。テンパイしていても降りるべき局面があり、その典型が「親リーチ×愚形×安手」。現物があるなら迷わず降りる。"},

{id:10,cat:"守備",
 scene:"上家がリーチ / 自分は降りると決めた",
 hand:[],
 q:"そのリーチ者に対して、理論上100%放銃しない牌はどれか？",
 choices:["リーチ者自身の河にある牌","誰も切っていない字牌","ドラ表示牌","リーチ者の現物のスジ"],answer:0,
 why:"リーチ者自身が捨てた牌はフリテンになるためロンできない＝絶対安全。同じく「リーチ後に他家が切って通った牌」も絶対安全で、この2つをまとめて現物と呼ぶ。ベタオリの第一候補は常に現物。生牌の字牌は「比較的安全」でしかなく、単騎・シャンポンには当たる。"},

{id:11,cat:"守備",
 scene:"リーチ者の河に 4m がある",
 hand:["4m"],
 q:"スジになる（両面待ちには当たらない）のはどれか？",
 choices:["1m","2m","3m","5m"],answer:0,
 why:"4mが河にあるなら、23mの両面（1m-4m待ち）も56mの両面（4m-7m待ち）もフリテンで成立しない。よって1mと7mがスジ。ただしスジが防げるのは両面だけで、シャンポン・単騎・カンチャンには当たる。スジ＝安全ではなく「危険度が半分以下になる」と理解する。"},

{id:12,cat:"守備",
 scene:"10巡目にリーチが入り、降りると決めた",
 hand:[],

const KEY = "mahjong-trainer/attempts";

  tab:"diagnose",

function load(){

/* ===================== helpers ===================== */
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function tileHTML(t){
  const honors = "東南西北白發中";
  if(honors.indexOf(t) >= 0){
    const cls = t==="中" ? "redc" : t==="發" ? "s3" : "z";
    return '<div class="tile"><span class="z '+cls+'">'+t+'</span></div>';
  }
  const suit = t[1], red = t[0]==="0";
  const num = red ? "5" : t[0];
  const mark = suit==="m" ? "萬" : suit==="p" ? "筒" : "索";
  const cls = red ? "redc" : suit==="m" ? "m" : suit==="p" ? "p" : "s3";
  return '<div class="tile'+(red?" red":"")+'"><span class="n '+cls+'">'+num+
         '</span><span class="s '+cls+'">'+mark+'</span></div>';
}
function handHTML(tiles){
  if(!tiles || !tiles.length) return "";
  const honors = "東南西北白發中";
  const groups = [];
  tiles.forEach(t=>{
    const s = honors.indexOf(t)>=0 ? "z" : t[1];
    const last = groups[groups.length-1];
    if(last && last.s===s) last.items.push(t); else groups.push({s:s, items:[t]});
  });
  return '<div class="hand">' + groups.map(g =>
    '<div class="grp">' + g.items.map(tileHTML).join("") + '</div>').join("") + '</div>';
}

function levelOf(pct){
  if(pct>=90) return ["上級手前","判断の型はできている。あとは場況読みと打点設計。"];
  if(pct>=80) return ["中級上位","本番で大負けする心配は少ない。取りこぼしは押し引きの精度。"];
  if(pct>=65) return ["中級","基本はできている。守備の徹底だけで着順が1つ上がる。"];
  if(pct>=50) return ["初級","知識はあるが判断が場当たり。ルール化すれば一気に伸びる。"];
  return ["入門","ルールは知っている段階。降りる技術から入れば最短で失点が減る。"];
}

function choicesHTML(q, picked, handler){
  return '<div class="choices">' + q.choices.map((c,n)=>{
    let cls = "";
    if(picked!==null){
      if(n===q.answer) cls="right"; else if(n===picked) cls="wrong"; else cls="mute";
    }
    return '<button class="'+cls+'" onclick="'+handler+'('+n+')">'+
           '<span class="idx">'+(n+1)+'</span>'+esc(c)+'</button>';
  }).join("") + '</div>';
}
function verdictHTML(q, picked, nextFn, nextLabel){
  const ok = picked===q.answer;
  return '<div class="verdict"><div class="head" style="color:'+(ok?"var(--jade)":"var(--vermilion)")+'">'+
    (ok ? "正解" : "不正解 — 正解は "+(q.answer+1)+". "+esc(q.choices[q.answer])) +
    '</div><p>'+esc(q.why)+'</p>'+
    '<button class="next" onclick="'+nextFn+'()">'+nextLabel+'</button></div>';
}

/* ===================== charts (inline svg) ===================== */
function radarSVG(vals){
  const cx=150, cy=132, R=88, N=5;
  const pt=(i,r)=>{const a=-Math.PI/2 + i*2*Math.PI/N;
    return [cx+r*Math.cos(a), cy+r*Math.sin(a)];};
  let g="";
  [25,50,75,100].forEach(lv=>{
    const p=[]; for(let i=0;i<N;i++){const q=pt(i,R*lv/100); p.push(q[0].toFixed(1)+","+q[1].toFixed(1));}
    g+='<polygon points="'+p.join(" ")+'" fill="none" stroke="#D6CCB4" stroke-width="1"/>';
  });
  for(let i=0;i<N;i++){const q=pt(i,R);
    g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke="#D6CCB4"/>';}
  const p=[]; vals.forEach((v,i)=>{const q=pt(i,R*Math.max(v,2)/100); p.push(q[0].toFixed(1)+","+q[1].toFixed(1));});
  g+='<polygon points="'+p.join(" ")+'" fill="rgba(196,52,43,.25)" stroke="#C4342B" stroke-width="2"/>';
  vals.forEach((v,i)=>{const q=pt(i,R*Math.max(v,2)/100);
    g+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3" fill="#C4342B"/>';});
  CATS.forEach((c,i)=>{
    const q=pt(i,R+22);
    const anchor = Math.abs(q[0]-cx)<8 ? "middle" : (q[0]>cx ? "start" : "end");
    g+='<text x="'+q[0].toFixed(1)+'" y="'+(q[1]+4).toFixed(1)+'" font-size="11" fill="#1A2422" text-anchor="'+anchor+'">'+c+'</text>';
  });
  return '<svg viewBox="0 0 300 270" width="100%" height="250" role="img" aria-label="分野別スコア">'+g+'</svg>';
}

function lineSVG(hist){
  const W=300,H=150,L=28,Rr=10,T=12,B=26, max=Q.length;
  const n=hist.length;
  const x=i=> n<=1 ? L+(W-L-Rr)/2 : L+i*(W-L-Rr)/(n-1);
  const y=v=> T+(H-T-B)*(1-v/max);
  let g="";
  [0,max/2,max].forEach(v=>{
    g+='<line x1="'+L+'" y1="'+y(v).toFixed(1)+'" x2="'+(W-Rr)+'" y2="'+y(v).toFixed(1)+'" stroke="#E5DDCA"/>';
    g+='<text x="'+(L-6)+'" y="'+(y(v)+3).toFixed(1)+'" font-size="9" fill="#5A6B66" text-anchor="end">'+Math.round(v)+'</text>';
  });
  const pts = hist.map((h,i)=>x(i).toFixed(1)+","+y(h.total).toFixed(1));
  if(n>1) g+='<polyline points="'+pts.join(" ")+'" fill="none" stroke="#C4342B" stroke-width="2"/>';
  hist.forEach((h,i)=>{
    g+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(h.total).toFixed(1)+'" r="3.5" fill="#C4342B"/>';
    if(i===0||i===n-1||n<=4)
      g+='<text x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" font-size="8.5" fill="#5A6B66" text-anchor="middle">'+h.date.slice(5)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="160" role="img" aria-label="スコア推移">'+g+'</svg>';
}

/* ===================== views ===================== */
function viewDiagnose(){
  if(S.done) return viewResult();
  const q = Q[S.qi];
  const okCount = S.answers.filter(a=>a.ok).length;
  let h = '<div class="progress"><span class="eyebrow">問 '+String(S.qi+1).padStart(2,"0")+
          ' / '+Q.length+' — '+q.cat+'</span><span class="rule"></span>'+
          '<span class="cnt">'+okCount+'正解</span></div>';
  h += '<div class="card"><div class="sub">'+esc(q.scene)+'</div>'+
       handHTML(q.hand)+
       '<p class="q">'+esc(q.q)+'</p>'+
       choicesHTML(q, S.picked, "pick");
  if(S.picked!==null)
    h += verdictHTML(q, S.picked, "nextQ", S.qi+1>=Q.length ? "結果を見る" : "次の問題へ");
  h += '</div>';
  return h;
}

function pick(n){ if(S.picked===null){ S.picked=n; render(); } }

function nextQ(){
  const q = Q[S.qi];
  S.answers.push({cat:q.cat, ok:S.picked===q.answer});
  S.picked=null;
  if(S.qi+1>=Q.length){
    S.done=true;
    const byCat={};
    CATS.forEach(c=>{
      const xs=S.answers.filter(a=>a.cat===c);
      byCat[c]=Math.round(xs.filter(a=>a.ok).length/xs.length*100);
    });
    S.history.push({date:new Date().toISOString().slice(0,10),
                    total:S.answers.filter(a=>a.ok).length, byCat:byCat});
    S.history = S.history.slice(-30);
    save();
  } else S.qi++;
  render();
}

function restart(){ S.qi=0;S.picked=null;S.answers=[];S.done=false;render();
  window.scrollTo({top:0,behavior:"instant"}); }

function viewResult(){
  const per = CATS.map(c=>{
    const xs=S.answers.filter(a=>a.cat===c);
    return {cat:c, ok:xs.filter(a=>a.ok).length, n:xs.length,
            pct:Math.round(xs.filter(a=>a.ok).length/xs.length*100)};
  });
  const total=S.answers.filter(a=>a.ok).length;
  const pct=Math.round(total/S.answers.length*100);
  const lv=levelOf(pct);
  const weak=per.slice().sort((a,b)=>a.pct-b.pct).slice(0,2);

  let h='<div class="card"><div class="eyebrow">診断結果</div>'+
    '<div class="score"><span class="big">'+total+'</span><span class="of">/ '+S.answers.length+
    '</span><span class="lv">'+lv[0]+'</span></div>'+
    '<p style="margin:8px 0 0;font-size:14px;color:#33403C">'+lv[1]+'</p></div>';

  h+='<div class="card tight">'+radarSVG(per.map(p=>p.pct))+'<div class="bars">'+
     per.map(p=>'<div class="bar"><span class="nm">'+p.cat+'</span>'+
       '<span class="track"><span class="fill" style="width:'+p.pct+'%;background:'+
       (p.pct>=70?"var(--jade)":"var(--vermilion)")+'"></span></span>'+
       '<span class="num">'+p.ok+'/'+p.n+'</span></div>').join("")+'</div></div>';

  h+='<div class="card"><div class="eyebrow">優先して潰すべき2つ</div>'+
     weak.map(w=>'<div class="weak" style="margin-top:12px"><h4>'+w.cat+'（'+w.ok+'/'+w.n+'）</h4>'+
       '<p>'+CAT_NOTE[w.cat]+'</p><p><span class="k">やること：</span>'+RX[w.cat].drill+'</p></div>').join("")+
     '<button class="ghost" onclick="restart()">もう一度診断する</button></div>';
  return h;
}

function viewDrill(){
  const list = Q.filter(q=>q.cat===S.dcat);
  const q = list[S.didx % list.length];
  let h='<nav style="margin:0 0 16px">'+CATS.map(c=>
    '<button class="'+(c===S.dcat?"on":"")+'" onclick="setCat(\''+c+'\')" '+
    'style="'+(c===S.dcat?"background:var(--brass);color:var(--feltDeep);border-color:var(--brass)":"")+
    ';font-size:12.5px;padding:5px 10px">'+c+'</button>').join("")+'</nav>';
  h+='<div class="note"><span class="k">この分野の要点：</span>'+CAT_NOTE[S.dcat]+'<br>'+
     '<span class="k">覚えるルール：</span>'+RX[S.dcat].rule+'</div>';
  h+='<div class="card"><div class="sub" style="display:flex;justify-content:space-between">'+
     '<span>'+esc(q.scene)+'</span><span style="font-family:var(--mono)">'+
     ((S.didx%list.length)+1)+'/'+list.length+'</span></div>'+
     handHTML(q.hand)+'<p class="q">'+esc(q.q)+'</p>'+choicesHTML(q,S.dpicked,"dpick");
  if(S.dpicked!==null) h+=verdictHTML(q,S.dpicked,"dnext","次へ");
  h+='</div>';
  return h;
}
function setCat(c){ S.dcat=c;S.didx=0;S.dpicked=null;render(); }
function dpick(n){ if(S.dpicked===null){S.dpicked=n;render();} }
function dnext(){ S.dpicked=null;S.didx++;render();window.scrollTo({top:0,behavior:"instant"}); }

function viewPlan(){
  const last = S.history.length ? S.history[S.history.length-1] : null;
  const weak = last
    ? Object.keys(last.byCat).sort((a,b)=>last.byCat[a]-last.byCat[b]).slice(0,2)
    : ["守備","押し引き"];
  let h='<div class="note">'+
    (last ? '直近の診断（'+last.date+'・'+last.total+'/'+Q.length+'）から、<span class="k">'+
            weak.join("と")+'</span>を重点に組んでいます。'
          : 'まだ診断結果がありません。先に実力診断を受けると、弱い分野が重点項目として差し込まれます。')+
    '<div style="margin-top:8px;color:#8FA9A3">週の順番は「失点を止める → 手を作る → 押し引き → 通し」。守備を先にするのは、伸びが一番早く、本番で効くからです。</div></div>';
  h += WEEKS.map(w=>
    '<div class="card"><div class="week"><span class="no">'+String(w.n).padStart(2,"0")+
    '</span><div><div class="lab">'+w.lab+'</div><div class="ttl">'+w.ttl+'</div></div></div>'+
    '<ul class="items">'+
      w.core.map(t=>'<li><span class="d">—</span><span>'+t+'</span></li>').join("")+
      weak.map(c=>'<li class="focus"><span class="d">重点</span><span><b>'+c+'</b>：'+RX[c].drill+'</span></li>').join("")+
    '</ul></div>').join("");
  return h;
}

function viewSheet(){
  let h='<div class="card"><div class="eyebrow">ベタオリの手順</div><ol class="steps">'+
    '<li>降りると決める（迷いながら押すのが一番損をする）。</li>'+
    '<li>手牌の安全牌を数え、残り巡目に足りるか確認する。</li>'+
    '<li>足りるなら安全な順に切って終わり。足りないなら、早い段階で危険度の低い牌を選んで切っておく。</li>'+
    '<li>誰かが押している牌をよく見る。他家が切って通った牌はそのリーチ者に対して安全。</li></ol></div>';

  h+='<div class="card"><div class="eyebrow">危険度の順序（安全 → 危険）</div>'+
    DANGER.map((d,i)=>{
      const r=Math.round(47+(196-47)*i/8), g=Math.round(143-(143-52)*i/8), b=Math.round(109-(109-43)*i/8);
      return '<div class="danger"><span class="sw" style="background:rgb('+r+','+g+','+b+')"></span>'+
        '<span><span class="t">'+d[0]+' <span>— '+d[1]+'</span></span>'+
        '<div class="d">'+d[2]+'</div></span></div>';
    }).join("")+'</div>';

  h+='<div class="card"><div class="eyebrow">赤ドラありで変わること</div>'+
    '<div class="hand" style="margin:12px 0">'+["0m","0p","0s"].map(tileHTML).join("")+'</div>'+
    '<ul class="plain">'+
    '<li>— 赤5は1枚1翻。ただし役ではないので、役が1つ必要（リーチ／タンヤオ／役牌）。</li>'+
    '<li>— 赤5は浮いていても切らない。5は両面2種に育つうえ、使えれば無条件で1翻。</li>'+
    '<li>— 赤を引いたら「リーチか、鳴きタンヤオか、役牌か」を早めに決める。</li>'+
    '<li>— 鳴いても打点が足りるので、赤＋タンヤオの鳴きは積極的に取る。</li>'+
    '<li>— 相手の打点も1翻ぶん上がる。押すときは強く、降りるときは早く徹底する。中途半端が一番損。</li>'+
    '<li>— 赤2枚以上を持ったら、愚形テンパイでもリーチして押してよい。</li>'+
    '</ul></div>';

  h+='<div class="card"><div class="eyebrow">押し引きの3条件</div>'+
    '<p style="margin:8px 0 0;font-size:14px;color:#33403C;line-height:1.75">'+
    'リーチに対して押してよいのは <b>良形・打点あり・テンパイ</b> が揃ったとき。'+
    '1つ欠けたら要注意、2つ欠けたら降りる。親リーチには条件を1段厳しくする。'+
    '2シャンテン以下は無条件で降りてよい。赤2枚以上を持っているときだけ、愚形でも押しに回ってよい。</p></div>';

  h+='<div class="card"><div class="eyebrow">点数早見</div><div style="margin-top:8px">'+
    POINTS.map(p=>'<div class="ptrow"><div class="a">'+p[0]+'</div><div class="b">'+p[1]+'</div></div>').join("")+
    '</div></div>';

  h+='<div class="card"><div class="eyebrow">当日のチェックリスト</div><ul class="plain">'+
    '<li>— 開始前にルールを確認：赤の枚数・食いタン・裏ドラ・順位点。ここで打ち方が変わる。</li>'+
    '<li>— 先制テンパイは愚形でも即リーチ。</li>'+
    '<li>— リーチが入ったら3秒で「良形／打点／シャンテン数」を確認する。</li>'+
    '<li>— 鳴く前に「鳴いた後の役は何か」を必ず言う。</li>'+
    '<li>— 大きくリードしている局は、アガリより放銃回避。</li>'+
    '<li>— 大負けの原因はほぼ全て「押すべきでない場面で押した」。迷ったら降りる。</li>'+
    '</ul></div>';
  return h;
}

function viewLog(){
  if(!S.history.length)
    return '<div class="card"><p style="margin:0;font-size:14px;color:#33403C">'+
      'まだ記録がありません。実力診断を最後まで受けると、その日の点数がここに残ります。'+
      '週に1回受け直すと、4週間の伸びが線で見えます。</p></div>';
  let h='<div class="card tight"><div class="eyebrow" style="padding:4px 4px 0">スコア推移（'+Q.length+'点満点）</div>'+
        lineSVG(S.history)+'</div>';
  h+='<div class="card"><div class="eyebrow">分野別の推移</div><div style="overflow-x:auto;margin-top:8px">'+
     '<table><thead><tr><th>日付</th>'+CATS.map(c=>'<th>'+c+'</th>').join("")+'<th>計</th></tr></thead><tbody>'+
     S.history.slice().reverse().map(hh=>'<tr><td>'+hh.date+'</td>'+
       CATS.map(c=>'<td style="color:'+(hh.byCat[c]>=70?"var(--jade)":"var(--vermilion)")+'">'+hh.byCat[c]+'</td>').join("")+
       '<td>'+hh.total+'</td></tr>').join("")+'</tbody></table></div>'+
     '<button class="ghost" onclick="clearLog()">記録をすべて消す</button></div>';
  return h;
}
function clearLog(){
  if(confirm("これまでの診断記録をすべて消します。よろしいですか？")){
    S.history=[]; save(); render();
  }
}

/* ===================== shell ===================== */
const TABS=[["diagnose","実力診断"],["drill","弱点ドリル"],["plan","4週間プラン"],["sheet","早見表"],["log","記録"]];
function setTab(t){ S.tab=t; render(); window.scrollTo({top:0,behavior:"instant"}); }

function render(){
  document.getElementById("qcount").textContent = Q.length;
  document.getElementById("nav").innerHTML = TABS.map(t=>
    '<button class="'+(S.tab===t[0]?"on":"")+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>').join("");
  const v = S.tab==="diagnose" ? viewDiagnose()
          : S.tab==="drill"    ? viewDrill()
          : S.tab==="plan"     ? viewPlan()
          : S.tab==="sheet"    ? viewSheet()
          :                      viewLog();
  document.getElementById("app").innerHTML = v;
}
render();
</script>
</body>
</html>
