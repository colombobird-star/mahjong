<title>麻雀 コーチ付き対局</title>
<style>

    --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;

  html,body{margin:0;padding:0}

  }
  .wrap{max-width:680px;margin:0 auto;padding:22px 16px 64px}
  .eyebrow{color:var(--brass);font-size:11px;letter-spacing:.18em;font-weight:600}
  h1{font-family:var(--serif);font-size:29px;letter-spacing:.04em;line-height:1.25;margin:4px 0 0;font-weight:600}
  .lede{color:#9DB5AF;font-size:13.5px;margin:8px 0 0}

  nav{display:flex;flex-wrap:wrap;gap:5px;margin:20px 0}

  }
  nav button.on{background:var(--ivory);color:var(--ink);border-color:var(--ivory);font-weight:600}
  nav button:focus-visible,.card button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  .card{background:var(--ivory);color:var(--ink);border-radius:6px;padding:16px;margin-bottom:16px}
  .card.tight{padding:12px}
  .note{

  .hand{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 12px;
        background:#E5DDCA;border-radius:3px;padding:12px;margin:12px 0 16px}
  .lbl{font-size:10.5px;color:#8A7B5C;letter-spacing:.12em;margin-bottom:6px}

  .rrow{display:flex;flex-wrap:wrap;gap:2px}

  body{padding:0}

</style>

<div class="wrap">

<div class="ov" id="coach"><div class="ovc">
  <h3>ちょっと待ってください</h3>
  <div id="coachBody"></div>
  <div style="display:flex;gap:8px;margin-top:14px">
    <button onclick="coachBack()" style="flex:1;padding:11px;border-radius:4px;border:1px solid var(--ivoryEdge);background:#fff;font-family:inherit;font-size:14px">選び直す</button>
    <button onclick="coachGo()" style="flex:1;padding:11px;border-radius:4px;border:0;background:var(--ink);color:var(--ivory);font-family:inherit;font-size:14px">このまま切る</button>
  </div>
</div></div>

  <div id="overBody"></div>
  <button id="btnNext" onclick="startHand()" style="width:100%;margin-top:14px;padding:12px;border-radius:4px;border:0;background:var(--vermilion);color:#fff;font-family:inherit;font-size:15px;font-weight:600">次の局へ</button>

<script>/* 麻雀 役判定・符計算・点数計算 */
const TN = (() => { const a = []; "mps".split("").forEach(x => { for (let n = 1; n <= 9; n++) a.push(n + x); });
  ["東","南","西","北","白","發","中"].forEach(z => a.push(z)); return a; })();
const idxOf = t => TN.indexOf(t);
const isHonor = i => i >= 27;
const isTerm = i => i < 27 && (i % 9 === 0 || i % 9 === 8);
const isYao = i => isHonor(i) || isTerm(i);
const suitOf = i => i < 27 ? Math.floor(i / 9) : 3;
const numOf = i => i < 27 ? i % 9 + 1 : 0;
const DRAGONS = [31, 32, 33];
const WINDS = [27, 28, 29, 30];

function cnt(tiles) { const c = new Array(34).fill(0); tiles.forEach(t => c[typeof t === "number" ? t : idxOf(t)]++); return c; }

/* ---------- 分解 ---------- */
function decompose(c0) {
  const c = c0.slice(), out = [];
  for (let p = 0; p < 34; p++) {
    if (c[p] < 2) continue;
    c[p] -= 2;
    const sets = [];
    (function rec(i) {
      while (i < 34 && c[i] === 0) i++;
      if (i >= 34) { out.push({ sets: sets.map(s => ({ ...s })), pair: p }); return; }
      if (c[i] >= 3) { c[i] -= 3; sets.push({ t: "k", tile: i, open: false }); rec(i); sets.pop(); c[i] += 3; }
      if (i < 27 && i % 9 <= 6 && c[i + 1] > 0 && c[i + 2] > 0) {
        c[i]--; c[i + 1]--; c[i + 2]--; sets.push({ t: "s", tile: i, open: false }); rec(i); sets.pop();
        c[i]++; c[i + 1]++; c[i + 2]++;
      }
    })(0);
    c[p] += 2;
  }
  return out;
}
function isChiitoi(c) { let p = 0; for (let i = 0; i < 34; i++) { if (c[i] === 2) p++; else if (c[i] !== 0) return false; } return p === 7; }
function isKokushi(c) {
  const Y = [0, 8, 9, 17, 18, 26, 27, 28, 29, 30, 31, 32, 33];
  let kinds = 0, pair = 0, tot = 0;
  for (let i = 0; i < 34; i++) { if (c[i] === 0) continue; if (Y.indexOf(i) < 0) return false; tot += c[i]; if (c[i] >= 1) kinds++; if (c[i] === 2) pair++; if (c[i] > 2) return false; }
  return kinds === 13 && pair === 1 && tot === 14;
}

/* ---------- 役 ---------- */
/* ctx: {menzen, riichi, doubleRiichi, ippatsu, tsumo, haitei, houtei, rinshan,
         bakaze, jikaze, winTile, melds:[{t,tile,open,kan}], dora, uradora} */
function yakuOf(dec, c14, ctx) {
  const list = [], all = dec.sets.concat(ctx.melds.map(m => ({ t: m.t, tile: m.tile, open: m.open, kan: m.kan })));
  const menzen = ctx.menzen;
  const runs = all.filter(s => s.t === "s"), trips = all.filter(s => s.t === "k");
  const add = (n, h) => list.push([n, h]);

  if (ctx.riichi) add(ctx.doubleRiichi ? "ダブル立直" : "立直", ctx.doubleRiichi ? 2 : 1);
  if (ctx.ippatsu) add("一発", 1);
  if (ctx.tsumo && menzen) add("門前清自摸和", 1);
  if (ctx.haitei) add("海底摸月", 1);
  if (ctx.houtei) add("河底撈魚", 1);
  if (ctx.rinshan) add("嶺上開花", 1);

  /* 平和 */
  if (menzen && trips.length === 0) {
    const pv = dec.pair;
    const yakuhaiPair = DRAGONS.indexOf(pv) >= 0 || pv === ctx.bakaze || pv === ctx.jikaze;
    let ryanmen = false;
    runs.forEach(s => {
      if (s.tile === ctx.winTile && numOf(s.tile) !== 7) ryanmen = true;
      if (s.tile + 2 === ctx.winTile && numOf(s.tile) !== 1) ryanmen = true;
    });
    if (!yakuhaiPair && ryanmen) add("平和", 1);
  }
  /* 断幺九 */
  let tan = true;
  for (let i = 0; i < 34; i++) if (c14[i] > 0 && isYao(i)) tan = false;
  all.forEach(s => { if (s.t === "s" && (numOf(s.tile) === 1 || numOf(s.tile) === 7)) tan = false; if (s.t === "k" && isYao(s.tile)) tan = false; });
  if (tan) add("断幺九", 1);
  /* 役牌 */
  trips.forEach(s => {
    if (DRAGONS.indexOf(s.tile) >= 0) add("役牌 " + TN[s.tile], 1);
    else if (s.tile === ctx.bakaze) add("場風 " + TN[s.tile], 1);
    else if (s.tile === ctx.jikaze) add("自風 " + TN[s.tile], 1);
  });
  /* 一盃口・二盃口 */
  if (menzen) {
    const key = {}; runs.forEach(s => key[s.tile] = (key[s.tile] || 0) + 1);
    let pairs = 0; Object.keys(key).forEach(k => pairs += Math.floor(key[k] / 2));
    if (pairs >= 2) add("二盃口", 3); else if (pairs === 1) add("一盃口", 1);
  }
  /* 三色同順 */
  const rt = {}; runs.forEach(s => { const n = numOf(s.tile); (rt[n] = rt[n] || {})[suitOf(s.tile)] = 1; });
  if (Object.keys(rt).some(n => Object.keys(rt[n]).length === 3)) add("三色同順", menzen ? 2 : 1);
  /* 三色同刻 */
  const kt = {}; trips.forEach(s => { if (s.tile < 27) { const n = numOf(s.tile); (kt[n] = kt[n] || {})[suitOf(s.tile)] = 1; } });
  if (Object.keys(kt).some(n => Object.keys(kt[n]).length === 3)) add("三色同刻", 2);
  /* 一気通貫 */
  [0, 1, 2].forEach(su => {
    const st = runs.filter(s => suitOf(s.tile) === su).map(s => numOf(s.tile));

      rec(i, m + 1, p, pr); mark(i, -1); mark(i + 1, -1); mark(i + 2, -1); w[i]++; w[i + 1]++; w[i + 2]++; }
    if (!pr && w[i] >= 2) { w[i] -= 2; mark(i, 2); rec(i, m, p, true); mark(i, -2); w[i] += 2; }
    if (w[i] >= 2) { w[i] -= 2; mark(i, 2); cur.push(mkTatsu(i, i)); rec(i, m, p + 1, pr);
      cur.pop(); mark(i, -2); w[i] += 2; }
    if (i < 27 && i % 9 <= 7 && w[i + 1]) {
      w[i]--; w[i + 1]--; mark(i, 1); mark(i + 1, 1); cur.push(mkTatsu(i, i + 1));
      rec(i, m, p + 1, pr); cur.pop(); mark(i, -1); mark(i + 1, -1); w[i]++; w[i + 1]++; }
    if (i < 27 && i % 9 <= 6 && w[i + 2]) {
      w[i]--; w[i + 2]--; mark(i, 1); mark(i + 2, 1); cur.push(mkTatsu(i, i + 2));
      rec(i, m, p + 1, pr); cur.pop(); mark(i, -1); mark(i + 2, -1); w[i]++; w[i + 2]++; }
    w[i]--; rec(i, m, p, pr); w[i]++;
  }
  rec(0, 0, 0, false);
  return best;
}
function overlapNote(c13, nm) {
  const A = ukeireOf(c13, nm).kinds;
  if (!A.length) return null;
  const As = {}; A.forEach(t => As[t] = 1);
  const bb = bestBlocks(c13, nm);
  if (!bb || bb.ts.length < 2) return null;
  const ts = bb.ts.filter(t => t.need.some(x => As[x]));
  for (let a = 0; a < ts.length; a++) for (let b = a + 1; b < ts.length; b++) {
    const sh = ts[a].need.filter(t => ts[b].need.indexOf(t) >= 0 && As[t]);
    if (sh.length) return { x: ts[a].nm, y: ts[b].nm, t: sh.map(t => TN[t]).join("・") };
  }
  return null;
}

function coachCheck(i) {
  if (COACH === "off") return null;
  const P = G.P[0], c = counts(P.hand), nm = P.melds.length;
  const opts = discardOpts(c, nm), best = opts[0];
  const chosen = opts.find(o => o.tile === P.hand[i].t);
  if (!chosen) return null;
  const myS = shantenN(c, nm);
  const tn = TN[P.hand[i].t];
  const threats = G.P.map((q, k) => (k !== 0 && q.riichi) ? k : -1).filter(k => k >= 0);
  const notes = [];
  const effNotes = () => {
    if (chosen.shanten > best.shanten)
      notes.push({ sev: 2, t: "シャンテン戻し", d: "打" + tn + "だと" + chosen.shanten +
        "シャンテンに戻ります。打" + TN[best.tile] + "なら" + best.shanten + "シャンテンのまま、受け入れ" +
        best.kinds.length + "種" + best.total + "枚です。" });
    else if (best.total - chosen.total > 0)
      notes.push({ sev: best.total - chosen.total >= 8 ? 2 : 1, t: "受け入れが狭い",
        d: "打" + tn + "は" + chosen.kinds.length + "種" + chosen.total + "枚。打" + TN[best.tile] +
           "なら" + best.kinds.length + "種" + best.total + "枚で、" + (best.total - chosen.total) + "枚広いです。" });
  };

  if (threats.length) {
    const sa = seenFor(G, 0);
    const dg = t => { let m = { s: -1, label: "" };
      threats.forEach(k => { const d = dangerOf(t, sa, safeSetOf(G, k)); if (d.s > m.s) m = d; }); return m; };
    const mine = dg(P.hand[i].t);
    let safest = { s: 1e9 }, safeTile = -1;
    P.hand.forEach(x => { const d = dg(x.t); if (d.s < safest.s) { safest = d; safeTile = x.t; } });

    if (myS >= 2) {
      /* 降りるべき局面。効率の指摘はしない */
      if (mine.s > safest.s + 0.5)
        notes.push({ sev: 2, t: "降りたほうが得",
          d: "リーチが入っていて自分は" + myS + "シャンテンです。" + tn + "は" + mine.label + "。" +
             TN[safeTile] + "（" + safest.label + "）が手の中にあります。2シャンテン以下は、" +
             "アガれる確率よりも放銃で失う点数のほうが大きいので、降りるのが基本です。" });
      return pick(notes);
    }
    /* テンパイ〜1シャンテン：押し引きの検討 */
    if (myS === 1 && mine.s > safest.s + 1.5)
      notes.push({ sev: 1, t: "押すか降りるか",
        d: "1シャンテンで" + tn + "（" + mine.label + "）を切ります。" + TN[safeTile] + "（" + safest.label +
           "）で回る手もあります。良形か打点があるなら押して構いません。" });
    /* 推奨牌が今より危険なら、効率だけを理由に勧めない */
    const bd = dg(best.tile);
    if (bd.s <= mine.s + 0.5) effNotes();
    else if (best.total - chosen.total >= 8)
      notes.push({ sev: 1, t: "受け入れと安全度のトレードオフ",
        d: "受け入れだけなら打" + TN[best.tile] + "が" + best.total + "枚で" + (best.total - chosen.total) +
           "枚広いですが、そちらは" + bd.label + "で" + tn + "（" + mine.label + "）より危険です。" +
           "打点と形を見て決めてください。" });
    return pick(notes);
  }
  effNotes();
  return pick(notes);

  function pick(ns) {
    if (!ns.length) return null;
    const worst = Math.max.apply(null, ns.map(n => n.sev));
    if (COACH === "after") { LOG.push("[検討] " + ns.map(n => n.t).join("・")); return null; }
    if (COACH === "loose" && worst < 2) return null;
    if (ns.some(n => n.t === "受け入れが狭い" || n.t === "シャンテン戻し")) {
      const bb = bestBlocks(c, nm);
      if (bb && bb.used[best.tile] < c[best.tile])
        ns.push({ sev: 0, t: "推す牌は浮き牌です",
          d: "打" + TN[best.tile] + "は、面子にも塔子にも使っていない浮き牌です。" +
             "ブロックを壊す前に、まず余っている牌から処理します。" });
      if (bb && bb.ts.length >= 2) {
        const desc = bb.ts.map(function (t) {
          if (t.kind === "カンチャン" && t.up.length)
            return t.nm + "（カンチャン・" + t.up.map(x => TN[x]).join("か") + "で両面化）";
          if (t.kind === "カンチャン") return t.nm + "（カンチャン・変化なし）";
          if (t.kind === "ペンチャン") return t.nm + "（ペンチャン・変化なし）";
          return t.nm + "（" + t.kind + "）";
        });
        const weak = bb.ts.filter(t => (t.kind === "ペンチャン") || (t.kind === "カンチャン" && !t.up.length));
        if (weak.length && bb.ts.some(t => t.kind === "両面" || (t.kind === "カンチャン" && t.up.length)))
          ns.push({ sev: 0, t: "塔子の優劣",
            d: "今ある塔子は " + desc.join(" ／ ") + "。受け入れ枚数が同じでも、" +
               "引いたあとに良くなる形とそうでない形があります。外すなら変化のない" +
               weak[0].nm + "から。" });
      }
      const t0 = P.hand[i];
      const dset = {}; G.doraInd.forEach(d => dset[doraOf(d)] = 1);
      if (t0.red) ns.push({ sev: 1, t: "赤ドラです",
        d: "その牌は赤ドラです。切ると確定していた1翻がなくなります。手が狭くなっても抱える価値があるか、もう一度考えてください。" });
      else if (dset[t0.t]) ns.push({ sev: 1, t: "ドラです",
        d: "その牌はドラです。切ると1翻ぶん打点が下がります。" });
    }
    return ns;
  }
}
function showCoach(notes) {
  $("coachBody").innerHTML = notes.map(n => '<div class="cn"><b>' + n.t + '</b><p>' + n.d + '</p></div>').join("");
  $("coach").style.display = "flex";
}
function coachGo() { $("coach").style.display = "none"; commitDiscard(PEND.i); PEND = null; }
function coachBack() { $("coach").style.display = "none"; PEND = null; }
function setCoach(m) { COACH = m; document.querySelectorAll("#cmode button").forEach(b =>
  b.className = b.dataset.m === m ? "on" : ""); }
/* ---- 終了処理 ---- */
function endWin(res) {
  G.over = true; WAIT = null;
  const r = res.r, w = res.p, P = G.P[w], dealer = w === 0;
  let html = '<h3>' + (res.type === "tsumo" ? "ツモ" : "ロン") + '　' + POSN[w] + '</h3>';
  html += '<div class="wh">' + P.hand.map(x => tileHTML(x.t, x.red, "sm")).join("") +
    (res.type === "ron" ? '<span class="win">' + tileHTML(G.last.t, G.last.red, "sm") + '</span>' : "") +
    (P.melds.length ? " " + meldHTML(P.melds) : "") + '</div>';
  html += '<div class="yk">' + r.yaku.map(y => '<span>' + y[0] + '</span>').join("") + '</div>';
  html += '<div class="pt">' + (r.yakuman ? "役満" : r.han + "翻" + r.fu + "符") + "　" +
    (res.type === "tsumo" ? (r.each ? r.each + "オール" : r.ko + "/" + r.oya) : r.ron + "点") + '</div>';
  /* 精算 */
  const hb = G.honba * 300;
  if (res.type === "ron") { P.score += r.ron + hb; G.P[res.from].score -= r.ron + hb; }
  else { const h = G.honba * 100;
    if (r.each) { G.P.forEach((q, i) => { if (i !== w) { q.score -= r.each + h; P.score += r.each + h; } }); }
    else { G.P.forEach((q, i) => { if (i === w) return; const v = (i === G.dealer ? r.oya : r.ko) + h;
      q.score -= v; P.score += v; }); } }
  P.score += G.sticks * 1000;   /* 供託はツモ・ロンどちらでも和了者が回収 */
  G.sticks = 0;
  const fin = finishHand(w === G.dealer);
  showEnd(html, fin);
}
function endRyuukyoku() {
  G.over = true; WAIT = null;
  const tenpai = G.P.map(P => shantenN(counts(P.hand), P.melds.length) <= 0);
  const n = tenpai.filter(x => x).length;
  let html = '<h3>流局</h3><div class="yk">' + G.P.map((P, i) =>
    '<span>' + POSN[i] + '：' + (tenpai[i] ? "テンパイ" : "ノーテン") + '</span>').join("") + '</div>';
  if (n > 0 && n < 4) { const pay = 3000 / n, get = 3000 / (4 - n);
    G.P.forEach((P, i) => P.score += tenpai[i] ? Math.round(pay) : -Math.round(get)); }
  html += '<div class="pt">' + (n === 0 || n === 4 ? "点数移動なし" : "テンパイ料の精算あり") + '</div>';
  const fin = finishHand(tenpai[G.dealer]);
  showEnd(html, fin);
}
function finishHand(dealerKeeps) {
  const scores = G.P.map(p => p.score);
  let kyoku = G.kyoku, honba = G.honba;
  if (dealerKeeps) honba++; else { kyoku++; honba = 0; }
  SERIES = (kyoku > 4) ? null : { kyoku, honba, sticks: G.sticks, scores };
  return kyoku > 4;
}
function showEnd(html, fin) {
  html += '<div class="sco">' + G.P.map((P, i) => '<span>' + POSN[i] + ' ' + P.score + '</span>').join("") + '</div>';
  if (LOG.length) html += '<div class="lg">' + LOG.slice(-8).join(" / ") + '</div>';
  if (fin) {
    const order = G.P.map((P, i) => ({ i, s: P.score })).sort((a, b) => b.s - a.s);
    html += '<h3 style="margin-top:14px">東風戦 終了</h3><div class="yk">' +
      order.map((o, k) => '<span>' + (k + 1) + '位 ' + POSN[o.i] + ' ' + o.s + '</span>').join("") + '</div>';
  }
  $("btnNext").textContent = fin ? "новую" : "次の局へ";
  $("btnNext").textContent = fin ? "もう一度はじめから" : "次の局へ";
  $("overBody").innerHTML = html;
  $("over").style.display = "flex";
  render();
}

startHand();
